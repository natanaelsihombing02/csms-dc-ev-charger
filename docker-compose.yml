services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: csms
      POSTGRES_USER: csms
      POSTGRES_PASSWORD: csms_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
